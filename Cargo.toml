[package]
name = "cipherbox-pqc-wasm"
version = "0.1.0"
edition = "2024"
authors = ["Thomas selfworker112@mailfence.com"]
description = "Post-Quantum Cryptography for WebAssembly (ML-KEM, ML-DSA, Argon2, ChaCha20-Poly1305)"
license = "MIT"
repository = "https://github.com/thomas666-beast/cipherbox-pqc-wasm"
keywords = ["pqc", "cryptography", "wasm", "post-quantum", "kyber"]
categories = ["cryptography", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
kyberlib = "0.0.7" # Upgraded from 0.0.1 to fix encapsulate
ml-dsa = "0.0.4"
rand = { version = "0.8", features = ["getrandom"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
