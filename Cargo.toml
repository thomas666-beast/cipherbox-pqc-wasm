[package]
name = "cipherbox-pqc-wasm"
version = "0.3.0"
edition = "2024"
authors = ["Thomas <selfworker112@mailfence.com>"]
description = "Post-Quantum Cryptography for WebAssembly (ML-KEM, ML-DSA, Argon2, ChaCha20-Poly1305)"
license = "MIT"
repository = "https://github.com/thomas666-beast/cipherbox-pqc-wasm"
keywords = ["pqc", "cryptography", "wasm", "post-quantum", "kyber"]
categories = ["cryptography", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cipherbox-pqc-core = { path = "../cipherbox-pqc-core", version = "0.3.0" }
wasm-bindgen = "0.2"
js-sys = "0.3"

# getrandom 0.2 (if anything still uses it) — keep the js feature
getrandom = { version = "0.2", features = ["js"] }

# getrandom 0.4 — enable the wasm_js backend for wasm32 targets
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
